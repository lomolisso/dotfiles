# Firmware and Bluetooth. GPU drivers and CPU microcode are per machine: archinstall
# or machines/<computer>.

[arch]
packages = [
  # Sound firmware
  "sof-firmware",

  # Bluetooth
  { name = "bluez", hooks = { after_sync = ["sudo", "systemctl", "enable", "--now", "bluetooth.service"] } },
  "bluez-utils",
  "bluetui",
]
