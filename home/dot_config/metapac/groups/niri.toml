# Compositor and session plumbing, based on archinstall's niri profile.
# The profile's design-choice packages (alacritty, fuzzel, mako, waybar,
# swaybg, swayidle, swaylock) are left out; our picks are in desktop.toml. Its seat
# service and our greeter are system packages, in install.sh.

[arch]
packages = [
  "niri",
  "xorg-xwayland",
  "xwayland-satellite",
  "xorg-xauth", # ssh -X (ForwardX11) needs it to hand remote apps a display
  "xdg-desktop-portal-gnome",
  "xdg-utils",
  "qt6-wayland",

  # Wayland utilities
  "wl-clipboard",
  "grim",
  "slurp",
]
