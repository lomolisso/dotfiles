# shin: black, greys, white and wine red, like waybar/rofi/ghostty.
# UI is greys + wine; the other hues only show up in syntax and diffs.

# --- UI ---
"ui.background" = { bg = "bg" }
"ui.text" = "fg"
"ui.text.focus" = { fg = "fg", modifiers = ["bold"] }
"ui.text.inactive" = "muted"
"ui.cursor" = { fg = "bg", bg = "fg-dim" }
"ui.cursor.primary" = { fg = "bg", bg = "red-bright" }
"ui.cursor.match" = { fg = "red-bright", modifiers = ["bold", "underlined"] }
"ui.cursorline.primary" = { bg = "bg-alt" }
"ui.selection" = { bg = "surface" }
"ui.selection.primary" = { bg = "red-deep" }
"ui.highlight" = { bg = "surface" }
"ui.linenr" = "faint"
"ui.linenr.selected" = { fg = "red-bright", modifiers = ["bold"] }
"ui.gutter" = { bg = "bg" }
"ui.statusline" = { fg = "fg-dim", bg = "bg" }
"ui.statusline.inactive" = { fg = "muted", bg = "bg" }
"ui.statusline.normal" = { fg = "fg", bg = "red", modifiers = ["bold"] }
"ui.statusline.insert" = { fg = "bg", bg = "red-bright", modifiers = ["bold"] }
"ui.statusline.select" = { fg = "bg", bg = "rose", modifiers = ["bold"] }
"ui.bufferline" = { fg = "muted", bg = "bg" }
"ui.bufferline.active" = { fg = "fg", bg = "bg", modifiers = ["bold"] }
"ui.bufferline.background" = { bg = "bg" }
"ui.popup" = { fg = "fg", bg = "bg" }
"ui.popup.info" = { fg = "fg", bg = "bg" }
"ui.window" = "red"
"ui.help" = { fg = "fg", bg = "bg" }
"ui.menu" = { fg = "fg", bg = "bg" }
"ui.menu.selected" = { fg = "fg", bg = "red" }
"ui.menu.scroll" = { fg = "red", bg = "surface" }
"ui.picker.header" = { fg = "red-bright", modifiers = ["bold"] }
"ui.virtual.whitespace" = "grey-line"
"ui.virtual.indent-guide" = "grey-line"
"ui.virtual.ruler" = { bg = "bg-alt" }
"ui.virtual.inlay-hint" = "faint"
"ui.virtual.jump-label" = { fg = "red-bright", modifiers = ["bold"] }
"ui.debug" = "red-bright"

# --- Diagnostics ---
"error" = "red-bright"
"warning" = "yellow"
"info" = "blue"
"hint" = "muted"
"diagnostic.error" = { underline = { color = "red-bright", style = "curl" } }
"diagnostic.warning" = { underline = { color = "yellow", style = "curl" } }
"diagnostic.info" = { underline = { color = "blue", style = "curl" } }
"diagnostic.hint" = { underline = { color = "muted", style = "curl" } }
"diagnostic.unnecessary" = { modifiers = ["dim"] }
"diagnostic.deprecated" = { modifiers = ["crossed_out"] }

# --- Syntax ---
"comment" = { fg = "faint", modifiers = ["italic"] }
"keyword" = "red-bright"
"keyword.control" = "red-bright"
"keyword.function" = "red-bright"
"keyword.storage" = "red-bright"
"operator" = "fg-dim"
"punctuation" = "muted"
"punctuation.special" = "rose"
"variable" = "fg"
"variable.builtin" = "rose"
"variable.parameter" = "fg-dim"
"variable.other.member" = "fg-dim"
"function" = "blue"
"function.builtin" = "blue"
"function.macro" = "magenta"
"constructor" = "yellow"
"type" = "yellow"
"type.builtin" = "yellow"
"namespace" = "magenta"
"constant" = "rose"
"constant.numeric" = "rose"
"constant.character.escape" = "cyan"
"string" = "green"
"string.regexp" = "cyan"
"string.special" = "cyan"
"attribute" = "magenta"
"label" = "red-bright"
"tag" = "red-bright"
"special" = "cyan"

# --- Markup ---
"markup.heading" = { fg = "red-bright", modifiers = ["bold"] }
"markup.list" = "red"
"markup.bold" = { modifiers = ["bold"] }
"markup.italic" = { modifiers = ["italic"] }
"markup.strikethrough" = { modifiers = ["crossed_out"] }
"markup.link.url" = { fg = "blue", modifiers = ["underlined"] }
"markup.link.text" = "rose"
"markup.quote" = { fg = "muted", modifiers = ["italic"] }
"markup.raw" = "green"

# --- Diffs ---
"diff.plus" = "green"
"diff.minus" = "red-bright"
"diff.delta" = "yellow"

[palette]
bg = "#000000"
bg-alt = "#1e1e1e"
surface = "#2a2a2a"
grey-line = "#393939"
fg = "#e9e9e9"
fg-dim = "#cfcfcf"
muted = "#989898"
faint = "#5c5c5c"
red = "#8c1625"
red-bright = "#cb4d66"
red-deep = "#750017"
rose = "#d5909e"
green = "#a2ff33"
yellow = "#ffb31a"
blue = "#668aff"
magenta = "#d95cff"
cyan = "#1aceff"
