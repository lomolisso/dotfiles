#!/bin/sh
# chezmoi modify script: btop rewrites btop.conf on exit, so instead of owning
# the whole file, only force the shin theme. Everything else stays btop's.
# (No btop.conf yet: write just this line; btop fills in the rest on first run.)
input=$(cat)
if [ -z "$input" ]; then
  printf 'color_theme = "shin"\n'
elif printf '%s\n' "$input" | grep -q '^color_theme'; then
  printf '%s\n' "$input" | sed 's|^color_theme = .*|color_theme = "shin"|'
else
  printf '%s\ncolor_theme = "shin"\n' "$input"
fi
