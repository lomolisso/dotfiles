# Idle handling for niri. Started by spawn-at-startup in ~/.config/niri/config.kdl.

general {
    lock_cmd = pidof hyprlock || hyprlock          # `loginctl lock-session` / Super+Alt+L
    before_sleep_cmd = loginctl lock-session       # lock before suspend
    after_sleep_cmd = niri msg action power-on-monitors
}

# Lock after 10 minutes idle.
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Turn the monitors off after 15 minutes idle.
listener {
    timeout = 900
    on-timeout = niri msg action power-off-monitors
    on-resume = niri msg action power-on-monitors
}
