# GRUB menu for this machine. Handwritten on purpose (not grub-mkconfig):
# grub-mkconfig would add an Arch entry for /boot/vmlinuz-linux without an
# initramfs, which can't boot here. Arch instead boots the same unified kernel
# image rEFInd booted, /EFI/Linux/arch-linux.efi, which mkinitcpio rebuilds on
# every kernel update, so this file never needs regenerating.
# Installed to /boot/grub/grub.cfg by install.sh, next to this file (rerun it after edits).
# The UUIDs below are this machine's; install.sh checks they exist before copying.
#
#   nvme0n1p5  E7BE-2768  Linux EFI partition, mounted at /boot (GRUB, Arch)
#   nvme0n1p1  C084-6110  Windows EFI partition (Windows Boot Manager)

set default=arch
set timeout=20
set timeout_style=menu

# One-time default set by `grub-reboot <id>` (e.g. to test Windows without a keyboard).
if [ -s $prefix/grubenv ]; then
  load_env
fi
if [ "${next_entry}" ]; then
  set default="${next_entry}"
  set next_entry=
  save_env next_entry
fi

# Graphical menu with the VA-11 HALL-A theme. The theme is laid out for
# 1920x1080; "auto" is the fallback if the firmware doesn't offer that mode.
insmod part_gpt
insmod fat
insmod all_video
insmod gfxterm
insmod png
set gfxmode=1920x1080,auto
set gfxpayload=keep
loadfont $prefix/fonts/unicode.pf2
terminal_output gfxterm
loadfont $prefix/themes/valhalla/CyberpunkWaifus42.pf2
set theme=$prefix/themes/valhalla/theme.txt
export theme

# While an entry starts, the theme's console box shows a CALICOMP ticket, the
# bar's drink computer in VA-11 HALL-A: Arch is mixed, Windows is one of the
# "Bottled Drinks", firmware settings is a trip to Dana's back office.
# Console text can only use GRUB's 16 named colors; "red" is the closest to the
# theme's neonred #AB023E (which the box outline uses exactly). ASCII only: the
# pixel font has nothing else.
function ticket {
  set color_normal=red/black
  echo "CALICOMP 1.1 // $1"
  echo ""
  set color_normal=white/black
  echo "> $2"
  set color_normal=light-gray/black
  echo "  $3"
  echo ""
  echo "  $4"
}

menuentry "Arch Linux" --id arch {
  ticket "ORDER UP" "Arch Linux" "Mixed, not blended. Coming right up." "Time to mix drinks and change lives."
  insmod fat
  insmod chain
  search --no-floppy --fs-uuid --set=root E7BE-2768
  chainloader /EFI/Linux/arch-linux.efi
}

menuentry "Windows" --id windows {
  ticket "ORDER UP" "Windows" "Bottled drink. Just uncap it and serve." "Time to mix drinks and change lives."
  insmod fat
  insmod chain
  search --no-floppy --fs-uuid --set=root C084-6110
  chainloader /EFI/Microsoft/Boot/bootmgfw.efi
}

menuentry "UEFI Firmware Settings" --id uefi-firmware {
  ticket "BACK OFFICE" "UEFI Firmware Settings" "Knocking on Dana's office door..." "Hope she's in a good mood."
  fwsetup
}
